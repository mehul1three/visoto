<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="lwall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2320"/><stop offset="55%" stop-color="#332a25"/><stop offset="100%" stop-color="#241d1a"/>
    </linearGradient>
    <radialGradient id="hearth" cx="0.46" cy="0.82" r="0.34">
      <stop offset="0%" stop-color="#ff9d3c" stop-opacity="0.55"/><stop offset="60%" stop-color="#ff7a1a" stop-opacity="0.14"/><stop offset="100%" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rug" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3a52"/><stop offset="100%" stop-color="#382c40"/>
    </linearGradient>
    <linearGradient id="carpet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b5a4a"/><stop offset="100%" stop-color="#3a3028"/>
    </linearGradient>
    <linearGradient id="tvscr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22405e"/><stop offset="100%" stop-color="#0e2033"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/><stop offset="45%" stop-color="#ffffff" stop-opacity="0.03"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#lwall)"/>
  <rect width="1280" height="720" fill="url(#hearth)"/>

  <!-- picture frames (decorative) -->
  <rect x="250" y="180" width="120" height="90" rx="4" fill="#241d1a" stroke="#6b5741" stroke-width="6"/>
  <rect x="266" y="196" width="88" height="58" fill="#3c5a72"/>
  <rect x="400" y="205" width="80" height="110" rx="4" fill="#241d1a" stroke="#6b5741" stroke-width="6"/>
  <rect x="414" y="219" width="52" height="82" fill="#5a4470"/>

  <!-- floating shelf : solid  x=1080 y=350 w=180 h=20 -->
  <rect x="1080" y="350" width="180" height="20" rx="3" fill="#7d5636"/>
  <rect x="1080" y="350" width="180" height="6" rx="3" fill="#9a6b45"/>
  <rect x="1226" y="300" width="16" height="50" fill="#b4574f"/>
  <rect x="1244" y="312" width="12" height="38" fill="#4f7fbf"/>

  <!-- carpet + rug -->
  <rect x="0" y="640" width="1280" height="80" fill="url(#carpet)"/>
  <rect x="0" y="640" width="1280" height="6" fill="#8a7358"/>
  <rect x="180" y="646" width="620" height="60" rx="4" fill="url(#rug)" opacity="0.85"/>
  <rect x="210" y="658" width="560" height="4" fill="#6a5478" opacity="0.7"/>
  <rect x="210" y="686" width="560" height="4" fill="#6a5478" opacity="0.7"/>

  <!-- couch : bouncy  x=200 y=540 w=240 h=100.  Nothing is drawn above y=540:
       the cushion tops ARE the standable surface. -->
  <rect x="196" y="524" width="248" height="20" rx="8" fill="#3f5f7a"/>
  <rect x="200" y="540" width="240" height="56" rx="10" fill="#5a86a8"/>
  <rect x="204" y="546" width="112" height="44" rx="8" fill="#6b9abd"/>
  <rect x="324" y="546" width="112" height="44" rx="8" fill="#6b9abd"/>
  <rect x="200" y="592" width="240" height="48" rx="6" fill="#3f5f7a"/>
  <rect x="212" y="632" width="18" height="14" fill="#2a3f52"/>
  <rect x="410" y="632" width="18" height="14" fill="#2a3f52"/>

  <!-- fireplace : hazard  x=520 y=540 w=150 h=100 -->
  <rect x="504" y="516" width="182" height="124" rx="4" fill="#5c4a42"/>
  <rect x="504" y="516" width="182" height="14" rx="4" fill="#7a6255"/>
  <rect x="520" y="540" width="150" height="100" fill="#1a120e"/>
  <path d="M545 640 q10 -44 22 -58 q6 26 18 12 q14 -20 8 -44 q34 30 30 62 q-2 18 -14 28 z" fill="#ff8c2b"/>
  <path d="M568 640 q4 -30 14 -40 q4 18 12 8 q8 -14 5 -30 q22 21 20 42 q-2 12 -10 20 z" fill="#ffd166"/>
  <rect x="520" y="628" width="150" height="12" fill="#7a3b18"/>

  <!-- coffee table : solid  x=720 y=560 w=180 h=80 -->
  <rect x="720" y="560" width="180" height="16" rx="4" fill="#8a5f3d"/>
  <rect x="720" y="560" width="180" height="5" rx="3" fill="#a8764e"/>
  <rect x="732" y="576" width="14" height="64" fill="#5c3f28"/>
  <rect x="874" y="576" width="14" height="64" fill="#5c3f28"/>

  <!-- stacked magazines : crumbling  x=740 y=540 w=110 h=20 -->
  <rect x="742" y="548" width="106" height="12" rx="2" fill="#d9dee8" transform="rotate(-1.4 795 554)"/>
  <rect x="746" y="540" width="102" height="12" rx="2" fill="#f1f4f9" transform="rotate(1.6 797 546)"/>
  <rect x="762" y="544" width="60" height="3" fill="#aeb7c6"/>

  <!-- media console : solid  x=940 y=570 w=200 h=70 -->
  <rect x="940" y="570" width="200" height="70" rx="5" fill="#4a3b30"/>
  <rect x="940" y="570" width="200" height="6" rx="3" fill="#6b5644"/>
  <rect x="954" y="590" width="82" height="34" rx="3" fill="#3a2e26"/>
  <rect x="1046" y="590" width="82" height="34" rx="3" fill="#3a2e26"/>

  <!-- television : slippery  x=960 y=460 w=170 h=110 -->
  <rect x="960" y="460" width="170" height="110" rx="6" fill="#15181f"/>
  <rect x="970" y="468" width="150" height="94" rx="3" fill="url(#tvscr)"/>
  <rect x="970" y="468" width="150" height="94" rx="3" fill="url(#gloss)"/>
  <rect x="986" y="486" width="72" height="6" rx="3" fill="#3a6f9c"/>
  <rect x="986" y="502" width="104" height="6" rx="3" fill="#2f5c7f"/>
  <rect x="986" y="518" width="58" height="6" rx="3" fill="#2f5c7f"/>

  <!-- potted palm : solid  x=1150 y=480 w=110 h=160 -->
  <path d="M1205 488 q-44 -46 -56 -100 q42 12 56 64 q14 -58 58 -68 q-12 58 -58 104 z" fill="#3f8f5e"/>
  <path d="M1205 492 q-32 -22 -68 -24 q26 26 68 32 z" fill="#347a50"/>
  <rect x="1150" y="480" width="110" height="160" rx="10" fill="#a4623f"/>
  <rect x="1150" y="480" width="110" height="18" rx="8" fill="#bd7249"/>

  <!-- floor lamp (decorative, well clear of the route) -->
  <rect x="60" y="628" width="60" height="12" rx="4" fill="#2c3348"/>
  <rect x="84" y="470" width="8" height="158" fill="#39435b"/>
  <path d="M58 470 h60 l-12 -52 h-36 z" fill="#e0a44e"/>

  <!-- collectibles -->
  <circle cx="335" cy="435" r="15" fill="#f5d049" stroke="#c9a11f" stroke-width="3"/>
  <circle cx="1035" cy="395" r="15" fill="#f5d049" stroke="#c9a11f" stroke-width="3"/>
  <circle cx="1205" cy="445" r="15" fill="#f5d049" stroke="#c9a11f" stroke-width="3"/>
</svg>
